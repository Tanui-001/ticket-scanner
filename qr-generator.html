
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalenjin Connect 2.0 | QR Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            color: #102849;
            padding: 24px;
        }

        main {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
        }

        h1 {
            color: #09284d;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #cbd8e9;
            border-radius: 9px;
            font: 14px/1.5 Consolas, monospace;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .ticket {
            border: 1px solid #dce5f2;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            break-inside: avoid;
        }

        .qr {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }

        button {
            background: #1474e8;
            color: white;
            border: 0;
            padding: 11px 16px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media print {
            button {
                display: none;
            }
        }
    </style>

</head>

<body>

<main>

    <h1>Kalenjin Connect 2.0 — QR Tickets</h1>

    <p>Each QR contains its ticket details, so the scanner does not need a preloaded ticket list.</p>

    <label for="ticket-data">Paste a JSON array of ticket details (up to 1,000)</label>
    <textarea id="ticket-data" spellcheck="false"
        placeholder='[{"id":"KC-1001","name":"Jane Doe","category":"VIP"}]'></textarea>

    <div class="actions">
        <button id="generate-tickets">Generate QR tickets</button>
        <button onclick="window.print()">Print QR tickets</button>
    </div>
    <p id="generator-status" aria-live="polite"></p>

    <div class="grid" id="ticket-grid"></div>

</main>


<script>
const MAX_TICKETS = 1000;

document.getElementById("generate-tickets")
    .addEventListener("click", generateTickets);

function generateTickets() {
    const grid = document.getElementById("ticket-grid");
    const status = document.getElementById("generator-status");
    grid.replaceChildren();

    let tickets;
    try {
        tickets = JSON.parse(document.getElementById("ticket-data").value);
    } catch (error) {
        status.textContent = "Invalid JSON: " + error.message;
        return;
    }

    if (!Array.isArray(tickets) || tickets.length === 0) {
        status.textContent = "Enter a non-empty JSON array of tickets.";
        return;
    }
    if (tickets.length > MAX_TICKETS) {
        status.textContent = "A maximum of 1,000 tickets can be generated at once.";
        return;
    }

    const seenIds = new Set();
    const normalized = [];

    for (let index = 0; index < tickets.length; index += 1) {
        const source = tickets[index];
        const id = source && String(source.id || source.ticketId || "").trim();
        const name = source && String(source.name || source.attendee || "").trim();
        const category = source && String(source.category || "General").trim();
        const ticketStatus = source && String(source.status || "valid").trim().toLowerCase();

        if (
            !id ||
            !name ||
            id.length > 128 ||
            name.length > 200 ||
            category.length > 100 ||
            ticketStatus.length > 40
        ) {
            status.textContent = `Ticket ${index + 1} needs an ID and attendee name.`;
            return;
        }
        if (seenIds.has(id.toLowerCase())) {
            status.textContent = `Duplicate ticket ID: ${id}`;
            return;
        }

        seenIds.add(id.toLowerCase());
        normalized.push({ id, name, category, status: ticketStatus });
    }

    normalized.forEach(ticket => {
        const card = document.createElement("article");
        card.className = "ticket";

        const heading = document.createElement("h3");
        heading.textContent = ticket.id;

        const name = document.createElement("p");
        name.textContent = `${ticket.name} · ${ticket.category}`;

        const qr = document.createElement("div");
        qr.className = "qr";

        card.append(heading, name, qr);
        grid.appendChild(card);

        new QRCode(qr, {
            text: JSON.stringify(ticket),
            width: 150,
            height: 150
        });
    });

    status.textContent = `Generated ${normalized.length} QR ticket${normalized.length === 1 ? "" : "s"}.`;
}
</script>

</body>
</html>
